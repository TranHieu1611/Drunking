<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0714">
<title>Say Hay Sợ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" media="print" onload="this.media='all'" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;800;900&display=swap">
<style>
:root{
  --bg1:#0b0714;--bg2:#1a0b2e;--panel:#21123a;--panel2:#2c1a4b;--line:#ffffff1f;
  --text:#f6f0ff;--muted:#b9a9d6;
  --purple:#b026ff;--pink:#ff2e88;--yellow:#ffd60a;--cyan:#00f0ff;--red:#ff3b3b;--green:#2bff88;
  --c:var(--purple);
  --font:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:linear-gradient(160deg,var(--bg1),var(--bg2));background-attachment:fixed;color:var(--text);font:400 16px/1.45 var(--font);overflow:hidden;overscroll-behavior:none}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation;user-select:none;-webkit-user-select:none}
#app{height:100vh;height:100dvh;max-width:520px;margin:0 auto;overflow:hidden}
#shell{height:100%;display:flex;flex-direction:column}
#main{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:14px 16px calc(18px + env(safe-area-inset-bottom));display:flex;flex-direction:column}
.center{margin:auto 0;display:flex;flex-direction:column;gap:14px;text-align:center;width:100%}
.stack{display:flex;flex-direction:column;gap:12px}
h1,h2,h3{margin:0;font-weight:900;line-height:1.15}
.muted{color:var(--muted)}.small{font-size:14px}

/* Nút */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:56px;padding:10px 16px;border:1px solid var(--line);border-radius:16px;background:var(--panel2);font-weight:800;font-size:18px;transition:transform .08s}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.pri{background:linear-gradient(135deg,var(--purple),var(--pink));border:0;box-shadow:0 0 22px #b026ff66}
.btn.ok{background:linear-gradient(135deg,#0fbf6b,#2bff88);color:#04170c;border:0}
.btn.warn{background:linear-gradient(135deg,#d97a00,var(--yellow));color:#201400;border:0}
.btn.bad{background:linear-gradient(135deg,#b3122a,var(--red));border:0}
.btn.cyan{background:linear-gradient(135deg,#0a7f9c,var(--cyan));color:#00161c;border:0}
.btn.ghost{background:transparent}
.icon-btn{min-width:48px;min-height:48px;border-radius:14px;border:1px solid var(--line);background:var(--panel2);font-size:20px;display:inline-flex;align-items:center;justify-content:center;flex:none;padding:0}

/* Thanh trên */
.topbar{display:flex;align-items:center;gap:8px;padding:8px 12px 4px;padding-top:calc(8px + env(safe-area-inset-top))}
.topbar .brand{margin-right:auto;min-width:0;overflow:hidden;text-overflow:ellipsis;font-weight:900;letter-spacing:.3px;color:var(--yellow);text-shadow:0 0 12px #ffd60a88;white-space:nowrap}
@media (max-width:399px){.topbar .brand{font-size:14px;letter-spacing:0}.topbar{gap:6px}.topbar .chip{padding:4px 8px}}
@media (max-width:359px){.topbar .brand{visibility:hidden;flex:1 1 0}}
.chip{flex:none;padding:4px 10px;border-radius:99px;background:var(--panel);border:1px solid var(--line);font-size:13px;font-weight:600;white-space:nowrap}
.pbar{display:flex;gap:6px;overflow-x:auto;padding:8px 12px;scrollbar-width:none}
.pbar::-webkit-scrollbar{display:none}
.pchip{flex:none;width:68px;padding:6px 2px;border-radius:14px;border:1px solid var(--line);background:var(--panel);text-align:center;position:relative;min-height:48px}
.pchip .e{font-size:24px;line-height:1.1;display:block}
.pchip .n{display:block;font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 3px;color:var(--c)}
.pchip .m{display:flex;justify-content:center;gap:2px;white-space:nowrap;font-size:11px;font-weight:800;align-items:center;min-height:16px}
.pchip .m i{font-style:normal;border-radius:99px;min-width:15px;padding:0 3px;color:#071017}
.pchip .m .b{background:var(--cyan)}.pchip .m .r{background:var(--red);color:#fff}
.pchip.on{border-color:var(--c);animation:pulse 1.5s infinite}
.pchip .mute{position:absolute;top:-2px;right:0;font-size:13px}
@keyframes pulse{0%,100%{box-shadow:0 0 4px var(--c)}50%{box-shadow:0 0 16px var(--c)}}
.banners{display:flex;gap:6px;padding:0 12px 4px;overflow-x:auto;scrollbar-width:none}
.banners::-webkit-scrollbar{display:none}
.banner{flex:1 0 88%;display:flex;align-items:center;gap:8px;padding:4px 6px 4px 10px;border-radius:12px;background:#ffd60a1c;border:1px solid #ffd60a55;font-size:13px;line-height:1.2;font-weight:600}
.banner span{flex:1;min-width:0;overflow-wrap:anywhere;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden}
.banner button{flex:none;min-height:48px;min-width:48px;padding:0 10px;border-radius:10px;border:0;background:var(--yellow);color:#201400;font-weight:800;font-size:13px}
.lastlog{padding:0 14px 2px;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Lượt chơi */
.spot{position:relative;padding:18px 8px;border-radius:24px;background:radial-gradient(circle at 50% 28%,color-mix(in srgb,var(--c) 45%,transparent),transparent 68%)}
.spot .ava{font-size:72px;line-height:1.1;animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
.spot .pass{color:var(--muted);font-weight:600}
.spot .who{font-size:34px;font-weight:900;color:var(--c);text-shadow:0 0 18px var(--c);overflow-wrap:anywhere}
.spot.compact{padding:6px 8px}.spot.compact .ava{font-size:36px}.spot.compact .who{font-size:30px}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}
.choose{display:flex;flex-direction:column;gap:12px}
.choose .btn{min-height:88px;font-size:28px;font-weight:900;border-radius:22px}
.btn.truth{background:linear-gradient(135deg,#0a7f9c,var(--cyan));color:#00161c;border:0;box-shadow:0 0 22px #00f0ff55}
.btn.dare{background:linear-gradient(135deg,#e0115f,var(--pink));border:0;box-shadow:0 0 22px #ff2e8866}
.locked{font-size:13px;font-weight:600;display:block}

/* Thẻ */
.scene{perspective:1100px}
.card3d{position:relative;transform-style:preserve-3d;animation:flip .7s cubic-bezier(.3,.9,.35,1) both}
@keyframes flip{from{transform:rotateY(180deg)}to{transform:rotateY(0)}}
.face{backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:26px;border:2px solid var(--lv);box-shadow:0 0 26px var(--lv),inset 0 0 20px color-mix(in srgb,var(--lv) 25%,transparent);background:linear-gradient(170deg,var(--panel2),#160a29);padding:18px 18px 16px;min-height:280px;display:flex;flex-direction:column;gap:12px}
.face.back{position:absolute;inset:0;transform:rotateY(180deg);align-items:center;justify-content:center;font-weight:900;font-size:30px;color:var(--yellow);background:repeating-linear-gradient(45deg,#2c1a4b 0 14px,#21123a 14px 28px)}
.lv1{--lv:var(--green)}.lv2{--lv:var(--yellow)}.lv3{--lv:var(--red)}
.face .tagline{display:flex;justify-content:space-between;gap:8px;font-size:14px;font-weight:800}
.face .q{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;font-size:24px;font-weight:800;line-height:1.3;overflow-wrap:anywhere}
.face .cost{font-size:14px;text-align:center;color:var(--muted)}
.pn{font-weight:900;color:var(--c);text-shadow:0 0 10px color-mix(in srgb,var(--c) 60%,transparent)}
.note{font-size:15px;padding:8px 10px;border-radius:12px;background:#ffffff10;text-align:center}
.after-flip{animation:fadeup .4s .45s both}
@keyframes fadeup{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* Vòng quay */
.wheel-wrap{position:relative;width:min(84vw,300px);height:min(84vw,300px);margin:6px auto 0}
.wheel-wrap canvas{width:100%;height:100%;display:block;border-radius:50%;box-shadow:0 0 28px #b026ff88;will-change:transform}
.wheel-wrap .ptr{position:absolute;left:50%;top:-8px;margin-left:-13px;width:0;height:0;border:13px solid transparent;border-top:24px solid var(--yellow);filter:drop-shadow(0 0 6px #ffd60a);z-index:2}
.big-icon{font-size:76px;line-height:1.1;animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
.big{font-size:30px;font-weight:900;overflow-wrap:anywhere}

/* Ly bia */
.beer{width:112px;height:150px;margin:0 auto;border:4px solid #fff;border-top:0;border-radius:6px 6px 20px 20px;position:relative;overflow:hidden;background:#ffffff12}
.beer i{position:absolute;left:0;right:0;bottom:0;height:0;background:linear-gradient(#ffd60a,#f09a00);animation:fill 1.1s .1s ease-out forwards}
.beer i::before{content:"";position:absolute;left:-4px;right:-4px;top:-13px;height:16px;border-radius:12px;background:#fff}
@keyframes fill{to{height:86%}}

/* Lưới người chơi */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px}
.pgrid button{min-height:84px;padding:8px 4px;border-radius:16px;border:2px solid var(--line);background:var(--panel);font-weight:800;overflow:hidden}
.pgrid button .e{font-size:30px;display:block;line-height:1.15}
.pgrid button .n{display:block;font-size:14px;color:var(--c);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pgrid button.hl,.pgrid button.sel{border-color:var(--c);background:color-mix(in srgb,var(--c) 28%,var(--panel));box-shadow:0 0 16px var(--c)}
.count3{font-size:120px;font-weight:900;color:var(--yellow);text-shadow:0 0 28px var(--yellow);animation:pop .4s}
.timer{font-size:54px;font-weight:900;color:var(--yellow);text-shadow:0 0 20px #ffd60a99}

/* Toàn màn hình đặc biệt */
.death{background:radial-gradient(circle,#7a0014,#1c0208);border-radius:24px;padding:20px 14px;box-shadow:0 0 40px var(--red)}
.death .big{color:#fff;text-shadow:0 0 18px var(--red)}
textarea,.field{width:100%;border-radius:14px;border:1px solid var(--line);background:#0006;padding:12px;min-height:48px;font-size:16px;resize:vertical}
.glitch{font-size:36px;font-weight:900;color:var(--yellow);animation:glitch .5s steps(2) 4;text-shadow:3px 0 var(--pink),-3px 0 var(--cyan)}
@keyframes glitch{0%{transform:translate(0)}25%{transform:translate(-4px,2px) skewX(6deg)}50%{transform:translate(3px,-3px)}75%{transform:translate(-2px,3px) skewX(-6deg)}100%{transform:translate(0)}}
.event-bg{background:radial-gradient(circle,#4b0f6f,#180627);border:1px solid var(--purple);box-shadow:0 0 30px #b026ff88;border-radius:24px;padding:20px 14px}
.shake{animation:shake .45s}
@keyframes shake{10%,90%{transform:translateX(-3px)}20%,80%{transform:translateX(6px)}30%,50%,70%{transform:translateX(-9px)}40%,60%{transform:translateX(9px)}}
#flash{position:fixed;inset:0;background:var(--red);opacity:0;pointer-events:none;z-index:40}
#flash.go{animation:flash .6s}
@keyframes flash{0%,40%{opacity:.75}100%{opacity:0}}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}

/* Sheet, toast */
#sheet{position:fixed;inset:0;background:#000a;z-index:30;display:none;align-items:flex-end;justify-content:center}
#sheet.open{display:flex}
.sheet{width:100%;max-width:520px;max-height:88vh;max-height:88dvh;overflow-y:auto;background:var(--bg2);border:1px solid var(--line);border-bottom:0;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px;animation:slideup .2s ease-out}
@keyframes slideup{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);max-width:88vw;width:max-content;padding:10px 16px;border-radius:14px;background:#000d;border:1px solid var(--line);font-weight:600;z-index:60;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
.cardline{display:flex;gap:10px;align-items:flex-start;padding:10px;border-radius:14px;background:var(--panel);border:1px solid var(--line);text-align:left}
.cardline .i{font-size:26px;line-height:1.1}
.cardline.bonus{border-color:#00f0ff55}.cardline.penalty{border-color:#ff3b3b77}
.btn.cardbtn{justify-content:flex-start;text-align:left;font-size:16px;min-height:64px}
.btn.cardbtn .i{font-size:26px}

/* Setup */
.home-title{font-size:52px;font-weight:900;line-height:1.02;background:linear-gradient(120deg,var(--yellow),var(--pink),var(--purple));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 16px #ff2e8866)}
.sec{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:10px}
.sec h3{font-size:18px}
.addrow{display:flex;gap:8px}.addrow input{flex:1;min-width:0}
.prow{border:1px solid var(--line);border-radius:14px;padding:8px;background:#0003}
.prow .head{display:flex;align-items:center;gap:6px}
.prow .head input{flex:1;min-width:0;font-weight:800;color:var(--c);background:transparent;border:0;border-bottom:1px solid var(--line);border-radius:0;min-height:44px;padding:4px;font-size:17px}
.opts{display:flex;flex-direction:column;gap:10px;padding-top:10px}
.emojis{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:4px}
.emojis button{height:48px;font-size:24px;border-radius:10px;border:1px solid transparent;background:#ffffff0d;padding:0}
.emojis button.sel{border-color:var(--yellow);background:#ffd60a33}
.swatches{display:flex;flex-wrap:wrap;gap:10px}
.swatches button{width:36px;height:36px;border-radius:50%;border:2px solid #0000;padding:0;position:relative}
.swatches button::before{content:"";position:absolute;inset:-6px}
.swatches button.sel{border-color:#fff}
.tog{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;min-height:48px;padding:6px 2px;background:none;border:0;text-align:left;font-weight:600}
.tog .sw{flex:none;width:50px;height:28px;border-radius:99px;background:#fff3;position:relative;transition:background .15s}
.tog .sw::after{content:"";position:absolute;width:22px;height:22px;top:3px;left:3px;border-radius:50%;background:#fff;transition:left .15s}
.tog.on .sw{background:#0fbf6b}.tog.on .sw::after{left:25px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{min-height:48px;padding:4px 12px;border-radius:99px;border:1px solid var(--line);background:#ffffff0d;font-weight:600;font-size:14px}
.chips button.sel{background:var(--red);border-color:var(--red)}
.seg{display:flex;gap:6px}
.seg button{flex:1;min-width:0;min-height:48px;border-radius:12px;border:1px solid var(--line);background:#ffffff0d;font-weight:800;font-size:14px;padding:4px}
.seg button.sel{background:var(--purple);border-color:var(--purple)}
.seg button:disabled{opacity:.35}
.slides{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:12px;scrollbar-width:none;margin:0 -16px;padding:0 16px;text-align:left}
.slides::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;scroll-snap-align:center;background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:20px;min-height:360px;display:flex;flex-direction:column;gap:10px}
.slide h2{font-size:26px;color:var(--yellow)}
.slide p{margin:0}.slide ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
table{width:100%;border-collapse:collapse;font-size:14px;table-layout:fixed}
th,td{padding:7px 2px;text-align:center;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{width:34%;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.award{display:flex;align-items:center;gap:12px;padding:10px 12px;background:var(--panel);border:1px solid var(--line);border-radius:14px;text-align:left}
.award .i{font-size:30px}.award b{display:block}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;animation-delay:0s!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div id="app"><div id="shell">
  <div id="chrome"></div>
  <main id="main"></main>
</div></div>
<div id="sheet"></div>
<div id="toast" role="status"></div>
<div id="flash"></div>

  settings: { startLevel: 1, maxLevel: 3, autoEscalate: true, order: 'circle', events: true, outsideOff: false, sound: true },
});
let S = { version: 1, view: 'home', draft: newDraft(), game: null };
let state = null; // ván hiện tại (S.game)
const ui = { sheet: null, openId: null, resumePrompt: false, timers: [], sheetData: null };

function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { /* trình duyệt chặn lưu trữ */ } }
function load() {
  try {
    const d = JSON.parse(localStorage.getItem(KEY));
    if (d && d.version === 1) { S = d; state = S.game; }
  } catch (e) { /* dữ liệu hỏng thì bắt đầu lại */ }
}
const settings = () => (state ? state.settings : S.draft.settings);
const P = id => state.players.find(p => p.id === id);
const cur = () => P(state.turn.currentPlayerId);
const others = id => state.players.filter(p => p.id !== id);
const has = (p, c) => p.bonus.includes(c);
function take(p, c) { const i = p.bonus.indexOf(c); if (i >= 0) { p.bonus.splice(i, 1); p.stats.cardsUsed++; } }
const sipWord = (p, n) => `${n} ngụm${p.noAlcohol ? ' nước lọc' : ''}`;
const pName = p => `<span class="pn" style="--c:${p.color}">${esc(p.name)}</span>`;
function log(t) { state.log.push(t); if (state.log.length > 60) state.log.shift(); }
function addSips(p, n) { p.stats.sips += n; }
const freshStats = () => ({ sips: 0, truths: 0, dares: 0, refusals: 0, dodges: 0, pushes: 0, deathSentences: 0, cardsUsed: 0 });

function makePlayer(list) {
  const usedC = new Set(list.map(p => p.color)), usedE = new Set(list.map(p => p.emoji));
  return {
    id: 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
    name: '', emoji: EMOJIS.find(e => !usedE.has(e)) || EMOJIS[0], color: COLORS.find(c => !usedC.has(c)) || COLORS[0],
    coupleOk: false, bannedTags: [], noAlcohol: false, bonus: [], penalty: [], stats: freshStats(),
  };
}

/* ===== Âm thanh & rung ===== */
let actx = null;
function tone(f, d, type = 'sine', v = 0.15, at = 0, to = null) {
  const t = actx.currentTime + at, o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (to) o.frequency.exponentialRampToValueAtTime(to, t + d);
  g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.001, t + d);
  o.connect(g).connect(actx.destination); o.start(t); o.stop(t + d);
}
const SOUNDS = {
  click: () => tone(620, 0.04, 'triangle', 0.08),
  flip: () => tone(280, 0.22, 'sine', 0.16, 0, 1300),
  tick: () => tone(1500, 0.025, 'square', 0.05),
  reward: () => { tone(880, 0.14, 'sine', 0.16); tone(1320, 0.28, 'sine', 0.16, 0.12); },
  buzz: () => tone(110, 0.38, 'sawtooth', 0.2),
  siren: () => { tone(600, 0.3, 'square', 0.1, 0, 1200); tone(1200, 0.3, 'square', 0.1, 0.3, 600); },
  drum: () => { [0, 0.28, 0.56].forEach(a => tone(70, 0.26, 'sine', 0.5, a, 38)); },
};
function sfx(name) {
  if (!settings().sound) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
    SOUNDS[name]();
  } catch (e) { /* không có Web Audio */ }
}
const vibrate = p => { try { if (navigator.vibrate) navigator.vibrate(p); } catch (e) { /* bỏ qua */ } };

/* ===== Hiệu ứng ===== */
function toast(t) {
  const el = $('toast'); el.textContent = t; el.classList.add('on');
  clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('on'), 2400);
}
function shake() { const m = $('shell'); m.classList.remove('shake'); void m.offsetWidth; m.classList.add('shake'); }
function flash() { const f = $('flash'); f.classList.remove('go'); void f.offsetWidth; f.classList.add('go'); }
function confetti() {
  if (reduced()) return;
  const cv = $('fx'), c = cv.getContext('2d'), W = cv.width = innerWidth, H = cv.height = innerHeight;
  const cols = ['#b026ff', '#ff2e88', '#ffd60a', '#00f0ff', '#2bff88'];
  const parts = Array.from({ length: 110 }, () => ({
    x: W / 2, y: H * 0.42, vx: (Math.random() - 0.5) * 13, vy: -Math.random() * 13 - 3,
    s: 5 + Math.random() * 6, r: Math.random() * 6, vr: Math.random() - 0.5, col: pickOne(cols),
  }));
  const start = performance.now();
  (function frame(now) {
    const t = now - start;
    c.clearRect(0, 0, W, H);
    if (t > 1900) return;
    c.globalAlpha = Math.max(0, 1 - t / 1900);
    parts.forEach(p => {
      p.vy += 0.34; p.x += p.vx; p.y += p.vy; p.r += p.vr;
      c.save(); c.translate(p.x, p.y); c.rotate(p.r); c.fillStyle = p.col; c.fillRect(-p.s / 2, -p.s / 2, p.s, p.s * 0.6); c.restore();
    });
    requestAnimationFrame(frame);
  })(start);
}
function flyTo(icon, pid) {
  if (reduced()) return;
  const target = document.querySelector(`.pchip[data-id="${pid}"]`);
  if (!target || !target.animate) return;
  const r = target.getBoundingClientRect(), el = document.createElement('div');
  el.textContent = icon;
  el.style.cssText = 'position:fixed;left:50%;top:45%;font-size:52px;z-index:55;pointer-events:none';
  document.body.appendChild(el);
  const dx = r.left + r.width / 2 - innerWidth / 2 - 20, dy = r.top + r.height / 2 - innerHeight * 0.45 - 30;
  el.animate([{ transform: 'scale(1.3)' }, { transform: `translate(${dx}px,${dy}px) scale(.3)`, opacity: 0.4 }], { duration: 800, easing: 'cubic-bezier(.5,0,.3,1)' }).onfinish = () => el.remove();
}

/* ===== Rút thẻ (mục 7) ===== */
const hasB = c => c.text.includes('{B}');
function partnersFor(c, A) {
  const tags = c.tags || [];
  return others(A.id).filter(p => !tags.some(t => p.bannedTags.includes(t)) && (!tags.includes('couple') || p.coupleOk));
}
function eligible(c, A) {
  const tags = c.tags || [];
  if (state.settings.outsideOff && tags.includes('outside')) return false;
  if (!A) return true;
  if (tags.some(t => A.bannedTags.includes(t))) return false;
  if (tags.includes('couple') && !A.coupleOk) return false;
  if (hasB(c) || tags.includes('couple')) {
    const n = partnersFor(c, A).length;
    if (!n) return false;
    if (CONFIG.coupleWholeTable.includes(c.id) && n < others(A.id).length) return false;
  }
  return true;
}
// opts.level: mức trần thay cho mức hiện tại · opts.exact: chỉ lấy đúng mức đó · opts.notId: tránh thẻ đang hiện
function drawCard(type, A, opts = {}) {
  const L = opts.level || state.turn.level;
  const pool = (DATA[type] || []).concat(state.customCards.filter(c => c.type === type));
  const all = pool.filter(c => (opts.exact ? c.level === L : c.level <= L) && eligible(c, A) && c.id !== opts.notId);
  if (!all.length) return null;
  let avail = all.filter(c => !state.usedCardIds.includes(c.id));
  if (!avail.length) { // hết pool thì xáo lại
    const ids = new Set(all.map(c => c.id));
    state.usedCardIds = state.usedCardIds.filter(id => !ids.has(id));
    avail = all;
  }
  const same = avail.filter(c => c.level === L), low = avail.filter(c => c.level < L);
  const useSame = same.length && (!low.length || Math.random() < CONFIG.levelPreferChance);
  const c = pickOne(useSame ? same : low);
  state.usedCardIds.push(c.id);
  const out = { ...c, type, bId: null };
  if (A && (hasB(c) || (c.tags || []).includes('couple'))) out.bId = pickOne(partnersFor(c, A)).id;
  return out;
}
function cardHtml(c, A) {
  let t = esc(c.text);
  if (A && A.noAlcohol) t = t.replace(/(\d+ ngụm)(?! nước)/g, '$1 nước lọc');
  if (A) t = t.replace(/\{A\}/g, () => pName(A));
  if (c.bId && P(c.bId)) t = t.replace(/\{B\}/g, () => pName(P(c.bId)));
  return t;
}
// Thẻ couple không ghi {B} ("người bên phải", "chọn 1 người"): chỉ định người đã đồng ý để không rơi vào người chưa bật OK cặp.
function partnerNote(c) {
  if (!c.bId || hasB(c) || CONFIG.coupleWholeTable.includes(c.id)) return '';
  return `<div class="note">🤝 Làm cùng ${pName(P(c.bId))} (đã bật OK thử thách cặp).</div>`;
}

/* ===== Luồng: mỗi bước là dữ liệu trong queue nên tải lại trang vẫn tiếp tục được ===== */
function go(name, data = {}) { state.turn.phase = name; state.screen = { ...data, name }; save(); render(); }
function flow(...items) { state.queue.unshift(...items); next(); }
function next() {
  const doomed = state.players.find(p => p.penalty.length >= CONFIG.deathAt);
  if (doomed) return go('death', { pid: doomed.id, dare: null }); // Án Tử chen ngang mọi bước
  const it = state.queue.shift();
  if (it) return LOGIC[it.name] ? LOGIC[it.name](it) : go(it.name, it);
  if (!state.turn.ending) return endTurn();
  startNextTurn();
}
function newGame(d) {
  const players = JSON.parse(JSON.stringify(d.players));
  players.forEach((p, i) => { p.name = p.name.trim() || `Người ${i + 1}`; p.bonus = []; p.penalty = []; p.stats = freshStats(); });
  const s = { ...d.settings, startLevel: Math.min(d.settings.startLevel, d.settings.maxLevel) };
  return {
    version: 1, players, settings: s,
    turn: { index: 0, currentPlayerId: null, round: 1, level: s.startLevel, phase: '', card: null, targetB: null, ending: false, expiring: {}, turnsInRound: 0, turnsAtLevel: 0 },
    effects: [], usedCardIds: [], customCards: [], turnsSinceEvent: 0, nextEventAt: rand(...CONFIG.eventEvery),
    lastEventId: null, log: [], queue: [], screen: null, ended: false,
  };
}
function beginTurn(id) {
  const t = state.turn, p = P(id);
  t.currentPlayerId = id; t.card = null; t.targetB = null; t.ending = false;
  // Chỉ thẻ đang giữ từ trước lượt này mới có hiệu lực và hết hạn cuối lượt; thẻ nhận trong lượt để dành lượt sau.
  t.expiring = { forcedare: p.penalty.filter(x => x === 'forcedare').length, silence: p.penalty.filter(x => x === 'silence').length };
  state.effects = state.effects.filter(e => !(e.type === 'king' && e.playerIds.includes(id)));
  state.queue = [];
  go('turn');
}
function nextPlayerId() {
  const ps = state.players, id = state.turn.currentPlayerId;
  if (state.settings.order === 'random') return pickOne(ps.filter(p => p.id !== id)).id;
  return ps[(ps.findIndex(p => p.id === id) + 1) % ps.length].id;
}
function startNextTurn() { state.turn.index++; beginTurn(nextPlayerId()); }
function endTurn() {
  const t = state.turn, p = cur(), n = state.players.length;
  t.ending = true;
  for (const k of ['forcedare', 'silence']) {
    for (let i = 0; i < (t.expiring[k] || 0); i++) { const at = p.penalty.indexOf(k); if (at >= 0) p.penalty.splice(at, 1); }
  }
  t.expiring = {};
  if (++t.turnsInRound >= n) { t.turnsInRound = 0; t.round++; }
  if (state.settings.autoEscalate && ++t.turnsAtLevel >= CONFIG.levelUpRounds * n && t.level < state.settings.maxLevel) {
    t.level++; t.turnsAtLevel = 0;
    toast(`${LEVELS[t.level].icon} Lên mức ${LEVELS[t.level].name}!`); sfx('siren');
    log(`Độ cay tăng lên mức ${LEVELS[t.level].name}`);
  }
  if (state.settings.events && ++state.turnsSinceEvent >= state.nextEventAt) {
    const ev = chooseEvent();
    if (ev) {
      state.turnsSinceEvent = 0; state.nextEventAt = rand(...CONFIG.eventEvery); state.lastEventId = ev.id;
      state.queue.unshift({ name: 'event', ev });
    }
  }
  next();
}

/* ----- Phạt (mục 5.4) ----- */
const debtsOf = p => p.penalty.filter(x => x === 'debt').length;
const previewSips = (p, base) => (base + debtsOf(p)) * (p.penalty.length ? 2 : 1);
// Tính xong là Nợ Ly mất luôn, kể cả khi lần uống này sau đó bị Khiên chặn hoặc bị đẩy đi.
function makePenalty(p, base) {
  const pen = { victim: p.id, base, debt: debtsOf(p), doubled: p.penalty.length > 0, sips: previewSips(p, base), chain: [], bounces: 0, from: null };
  p.penalty = p.penalty.filter(x => x !== 'debt');
  return pen;
}
function randomPenalty() {
  const ids = Object.keys(CONFIG.penaltyWeights);
  return ids[weighted(ids, id => CONFIG.penaltyWeights[id])];
}
function penText(pen) {
  const p = P(pen.victim);
  return pen.bottoms ? `uống cạn ly${p.noAlcohol ? ' nước lọc' : ''}` : `uống ${sipWord(p, pen.sips)}`;
}
function creditDodges(pen, drinkerId) {
  [...new Set(pen.chain)].filter(id => id !== drinkerId).forEach(id => { if (P(id)) P(id).stats.dodges++; });
}
const canMirror = (pen, X) => !pen.shieldOnly && has(X, 'mirror') && pen.bounces < CONFIG.maxBounces && !!pen.from;
const LOGIC = {
  react(it) {
    const pen = it.pen, X = P(pen.victim);
    if (has(X, 'shield') || canMirror(pen, X)) return go('reaction', { pen });
    LOGIC.drink({ pen });
  },
  drink(it) {
    const pen = it.pen, p = P(pen.victim);
    creditDodges(pen, p.id);
    addSips(p, pen.bottoms ? CONFIG.bottomsUpSips : pen.sips);
    log(`${p.name} ${penText(pen)}`);
    go('drink', { pen });
  },
  useCards(it) {
    const p = P(it.pen.victim);
    if (['shield', 'mirror', 'ally'].some(c => has(p, c))) return go('useCards', { pen: it.pen });
    LOGIC.drink({ pen: it.pen });
  },
};
function blockWithShield(pen, p) {
  take(p, 'shield'); p.stats.dodges++; creditDodges(pen, p.id);
  log(`${p.name} dùng Khiên chặn phạt`);
  sfx('reward'); confetti();
  go('blocked', { pen });
}
function addBonus(p, id) {
  if (p.bonus.length < CONFIG.maxBonus) { p.bonus.push(id); return true; }
  state.queue.unshift({ name: 'bagFull', pid: p.id, card: id });
  return false;
}

/* ----- Vòng quay ----- */
function drawWheel(cv, segs) {
  const size = 300, dpr = Math.min(devicePixelRatio || 1, 3), c = cv.getContext('2d');
  cv.width = cv.height = size * dpr; c.scale(dpr, dpr);
  const total = segs.reduce((s, x) => s + x.w, 0), R = size / 2;
  let a = -Math.PI / 2;
  segs.forEach(s => {
    const sweep = s.w / total * Math.PI * 2;
    c.beginPath(); c.moveTo(R, R); c.arc(R, R, R - 2, a, a + sweep); c.closePath();
    c.fillStyle = s.color; c.fill(); c.strokeStyle = '#0b0714'; c.lineWidth = 2; c.stroke();
    c.save(); c.translate(R, R); c.rotate(a + sweep / 2); c.textAlign = 'right'; c.textBaseline = 'middle'; c.fillStyle = '#fff';
    c.font = '20px system-ui,"Segoe UI Emoji","Apple Color Emoji"'; c.fillText(s.icon, R - 8, 1);
    c.font = '800 12px "Be Vietnam Pro",system-ui,sans-serif'; c.fillText(s.label, R - 38, 1);
    c.restore();
    a += sweep;
  });
  c.beginPath(); c.arc(R, R, 22, 0, Math.PI * 2); c.fillStyle = '#0b0714'; c.fill(); c.strokeStyle = '#ffd60a'; c.lineWidth = 3; c.stroke();
}
function spinTo(cv, segs, idx, ms, done) {
  const total = segs.reduce((s, x) => s + x.w, 0);
  const edges = []; let acc = 0;
  segs.forEach(s => { edges.push(acc); acc += s.w / total * 360; });
  const a0 = edges[idx], a1 = idx + 1 < segs.length ? edges[idx + 1] : 360;
  const target = 360 * 5 - (a0 + (a1 - a0) * (0.15 + Math.random() * 0.7));
  const dur = reduced() ? Math.min(ms, 500) : ms, start = performance.now();
  let last = -1;
  (function frame(now) {
    const t = Math.min(1, Math.max(0, (now - start) / dur)), r = target * (1 - Math.pow(1 - t, 3.4));
    cv.style.transform = `rotate(${r}deg)`;
    const at = (360 - (r % 360)) % 360;
    let i = edges.length - 1; while (i > 0 && edges[i] > at) i--;
    if (i !== last) { if (last >= 0) sfx('tick'); last = i; }
    if (t < 1) requestAnimationFrame(frame);
    else if (S.view === 'game') done(); // bấm kết thúc ván lúc đang quay thì bỏ kết quả
  })(start);
}
function applySpin(seg) {
  const p = cur();
  let res = { icon: seg.icon, title: seg.label, desc: '' };
  if (['shield', 'mirror', 'swap', 'mystery'].includes(seg.id)) {
    const id = seg.id === 'mystery' ? pickOne(['ally', 'king']) : seg.id;
    const fit = addBonus(p, id);
    res = { icon: CARDS[id].icon, title: `Nhận ${CARDS[id].name}!`, desc: fit ? CARDS[id].desc : 'Túi đầy rồi, chọn bỏ thẻ ở bước sau.', good: true, fly: fit ? id : null };
    log(`${p.name} quay trúng ${CARDS[id].name}`);
  } else if (seg.id === 'nothing') {
    res.desc = pickOne(TEASES);
    log(`${p.name} quay trúng ô trống`);
  } else if (seg.id === 'bad') {
    const id = randomPenalty(); p.penalty.push(id);
    res = { icon: CARDS[id].icon, title: `Xui! Dính ${CARDS[id].name}`, desc: CARDS[id].desc, bad: true, fly: id };
    log(`${p.name} quay trúng ô Xui: ${CARDS[id].name}`);
  } else if (seg.id === 'alldrink') {
    others(p.id).forEach(o => addSips(o, 1));
    res.title = 'Cả bàn uống!'; res.desc = `Mọi người trừ ${p.name} uống 1 ngụm.`; res.good = true;
    log(`Cả bàn trừ ${p.name} uống 1 ngụm`);
  } else if (seg.id === 'jackpot') {
    res.title = 'JACKPOT!'; res.desc = 'Bạn được chọn 1 người uống cạn ly.'; res.good = true;
    state.queue.unshift({ name: 'pick', mode: 'jackpot', title: '💰 Chọn 1 người uống cạn ly', candidates: others(p.id).map(o => o.id), random: true });
  }
  go('spinResult', { res });
}

/* ----- Sự kiện (v1: 6 effect) ----- */
function chooseEvent() {
  const penalized = state.players.some(p => p.penalty.length);
  const list = DATA.events.filter(e => CONFIG.enabledEffects.includes(e.effect) && (e.effect !== 'heal_most_penalized' || penalized));
  const fresh = list.filter(e => e.id !== state.lastEventId);
  return fresh.length ? pickOne(fresh) : (list[0] || null);
}
function runEvent(ev) {
  const all = state.players.map(p => p.id);
  switch (ev.effect) {
    case 'manual_pick_loser':
      return go('pick', { mode: 'loser', ev, title: 'Ai thua?', candidates: all });
    case 'mostlikely_vote':
      return go('pick', { mode: 'loser', ev, title: 'Ai bị chỉ nhiều nhất?', candidates: all, countdown: true, q: drawCard('mostlikely', null).text });
    case 'never_round':
      return go('eventNever', { ev, q: drawCard('never', null).text, ticks: [] });
    case 'all_drink':
      state.players.forEach(p => addSips(p, ev.sips));
      log(`Cả bàn uống ${ev.sips} ngụm (${ev.name})`);
      return go('eventResult', { ev, icon: '🍻', desc: `Cả bàn uống ${ev.sips} ngụm. Không thẻ nào cứu được.` });
    case 'heal_most_penalized': {
      const most = Math.max(...state.players.map(p => p.penalty.length));
      const p = pickOne(state.players.filter(x => x.penalty.length === most));
      const c = p.penalty.splice(Math.floor(Math.random() * p.penalty.length), 1)[0];
      log(`${p.name} được xóa thẻ ${CARDS[c].name}`);
      return go('eventResult', { ev, icon: '😇', desc: `${p.name} được xóa ${CARDS[c].icon} ${CARDS[c].name}.` });
    }
    case 'random_card_each': {
      const lines = state.players.map(p => {
        const isBonus = Math.random() < CONFIG.randomCardBonusChance;
        const id = isBonus ? pickOne(BONUS_IDS) : randomPenalty();
        if (isBonus) addBonus(p, id); else p.penalty.push(id);
        return { pid: p.id, id, isBonus };
      });
      log('Mưa Thẻ: mỗi người nhận 1 thẻ');
      return go('eventResult', { ev, icon: '🌧️', lines });
    }
    default: next();
  }
}

/* ===== Giao diện: chrome ===== */
function renderChrome() {
  const el = $('chrome');
  if (S.view !== 'game') { el.innerHTML = ''; return; }
  const t = state.turn, lv = LEVELS[t.level], last = state.log[state.log.length - 1], focus = state.screen.name === 'reaction';
  const chips = state.players.map(p => `
    <button class="pchip ${p.id === t.currentPlayerId ? 'on' : ''}" style="--c:${p.color}" data-a="openBag" data-id="${p.id}" aria-label="Xem túi thẻ của ${esc(p.name)}">
      ${p.penalty.includes('silence') ? '<span class="mute">🤐</span>' : ''}
      <span class="e">${p.emoji}</span><span class="n">${esc(p.name)}</span>

const MOUNT = {
  approve() { countdown(CONFIG.approveSeconds, () => A.approve()); },
  spin() { drawWheel($('wheel'), CONFIG.wheel); },
  rescue() { drawWheel($('wheel'), rescueSegs()); },
  reaction() { sfx('buzz'); vibrate(200); countdown(CONFIG.reactionSeconds, () => A.reactDrink()); },
  drink() { sfx('buzz'); shake(); vibrate(120); },
  penIntro() { sfx('buzz'); shake(); vibrate(160); if (state.screen.got) flyTo(CARDS[state.screen.got].icon, state.screen.pen.victim); },
  death() { sfx('drum'); flash(); shake(); vibrate([300, 100, 300, 100, 500]); },
  event() { sfx('siren'); vibrate(200); },
  spinResult() {
    const r = state.screen.res;
    if (r.good) { sfx('reward'); confetti(); }
    if (r.bad) { sfx('buzz'); flash(); shake(); vibrate(300); }
    if (r.fly) flyTo(CARDS[r.fly].icon, state.turn.currentPlayerId);
  },
  eventResult() { sfx('reward'); },
  pick() {
    if (!state.screen.countdown) return;
    let n = 3; sfx('tick');
    const el = $('cd3');
    const iv = setInterval(() => {
      if (ui.sheet) return;
      n--;
      if (n > 0) { el.textContent = n; el.style.animation = 'none'; void el.offsetWidth; el.style.animation = ''; sfx('tick'); return; }
      clearInterval(iv); el.hidden = true; $('pickArea').hidden = false; sfx('siren');
    }, 1000);
    ui.timers.push(iv);
  },
};
function countdown(secs, done) {
  let n = secs;
  const iv = setInterval(() => {
    if (ui.sheet) return; // đang mở menu/tạm dừng thì đồng hồ dừng
    n--;
    const el = $('count'); if (el) el.textContent = n;
    if (n <= 3 && n > 0) sfx('tick');
    if (n <= 0) { clearInterval(iv); done(); }
  }, 1000);
  ui.timers.push(iv);
}

      ['🎯 Cách chơi', `<p>Đặt máy giữa bàn, chuyền tay theo lượt.</p><ul><li>Chọn <b>Thật</b> hoặc <b>Thách</b> rồi rút thẻ.</li><li>Làm xong: quay <b>Vòng Quay May Mắn</b>.</li><li>Không làm: <b>uống thay</b>, nhận thêm 1 thẻ phạt.</li><li>Càng về sau càng cay.</li></ul>`],
      ['🎁 Thẻ thưởng', `<p>Tối đa ${CONFIG.maxBonus} thẻ, thẻ ai người đó dùng.</p><ul>${BONUS_IDS.map(id => `<li>${CARDS[id].icon} <b>${CARDS[id].name}:</b> ${CARDS[id].desc}</li>`).join('')}</ul>`],
      ['💀 Thẻ phạt', `<ul>${['debt', 'forcedare', 'silence'].map(id => `<li>${CARDS[id].icon} <b>${CARDS[id].name}:</b> ${CARDS[id].desc}</li>`).join('')}<li>Đang giữ thẻ phạt mà bị phạt thì số ngụm <b>nhân đôi</b>.</li><li>💥 <b>Đủ ${CONFIG.deathAt} thẻ phạt là Án Tử:</b> cạn ly và làm 1 thử thách, không thẻ nào cứu được.</li></ul>`],
      ['🪞 Đẩy phạt', `<ul><li>Bị phạt được <b>Quay Đổi Vận</b>: ${pct}% đẩy được phạt miễn phí.</li><li>Bị đẩy sang? Bạn có <b>${CONFIG.reactionSeconds} giây</b> để dùng Khiên hoặc bật ngược bằng Gương.</li><li>Bật ngược tối đa ${CONFIG.maxBounces} lần mỗi chuỗi.</li></ul>`],
      ['🤝 An toàn', `<ul><li>Không ai bị ép: luôn có nút <b>Uống thay</b>.</li><li>Thử thách đụng chạm chỉ dành cho người bật <b>OK thử thách cặp</b>.</li><li>Có chế độ <b>nước lọc</b> cho người lái xe.</li><li>Câu ở lại bàn nhậu: chuyện trong game không mang ra ngoài 🤫</li></ul>`],
    ];
    return `<div class="center">
      <div class="slides">${slides.map(([t, b]) => `<section class="slide"><h2>${t}</h2>${b}</section>`).join('')}</div>
      <div class="small muted">Vuốt ngang để xem ${slides.length} trang luật</div>
      <button class="btn pri" data-a="startGame">🍻 Vào chơi</button>
      <button class="btn ghost" data-a="toSetup">⬅ Sửa cài đặt</button>
    </div>`;
  },
  game() { const f = SC[state.screen.name]; return f ? f() : ''; },
  end() {
    const ps = state.players;
    const award = (key, icon, name, what) => {
      const best = Math.max(...ps.map(p => p.stats[key]));
      const who = best > 0 ? ps.filter(p => p.stats[key] === best).map(pName).join(', ') : '<span class="muted">Chưa ai xứng đáng</span>';
      return `<div class="award"><span class="i">${icon}</span><div><b>${name}</b><span class="small muted">${what}${best > 0 ? ` · ${best}` : ''}</span><div>${who}</div></div></div>`;
    };
    return `<div class="stack">
      <h1 style="text-align:center;color:var(--yellow)">🏆 Tổng kết</h1>
      ${award('sips', '🍺', 'Bợm Nhậu', 'Uống nhiều ngụm nhất')}
      ${award('dodges', '🛡️', 'Vua Né Ly', 'Né được nhiều lần nhất')}
      ${award('pushes', '😈', 'Kẻ Gieo Rắc', 'Đẩy phạt nhiều nhất')}
      ${award('dares', '🔥', 'Liều Mạng', 'Hoàn thành nhiều thẻ Thách nhất')}
      ${award('refusals', '🐔', 'Gà Con', 'Từ chối nhiều nhất')}
      ${award('deathSentences', '💥', 'Tử Tù', 'Dính Án Tử nhiều nhất')}
      <div class="sec"><table>
        <thead><tr><th>Người</th><th>🍺</th><th>🗣️</th><th>🔥</th><th>🐔</th><th>🃏</th></tr></thead>
        <tbody>${ps.map(p => `<tr><td>${p.emoji} ${esc(p.name)}</td><td>${p.stats.sips}</td><td>${p.stats.truths}</td><td>${p.stats.dares}</td><td>${p.stats.refusals}</td><td>${p.stats.cardsUsed}</td></tr>`).join('')}</tbody>
      </table><div class="small muted">🍺 ngụm · 🗣️ Thật · 🔥 Thách · 🐔 từ chối · 🃏 thẻ đã dùng</div></div>
      <button class="btn pri" data-a="againKeep">🔁 Chơi ván mới (giữ người chơi)</button>
      <button class="btn ghost" data-a="toHomeClear">Về màn hình đầu</button>
    </div>`;
  },
};
function render() {
  ui.timers.forEach(t => clearInterval(t)); ui.timers = [];
  renderChrome();
  const main = $('main'), keep = S.view === 'setup', top = main.scrollTop;
  main.innerHTML = V[S.view]();
  main.scrollTop = keep ? top : 0;
  if (S.view === 'game' && MOUNT[state.screen.name]) MOUNT[state.screen.name]();
}

/* ===== Sheet ===== */
const SH = {
  menu: () => `<h2>Menu</h2>
    <button class="btn" data-a="openSheet" data-v="pause">⏸️ Tạm dừng</button>
    <button class="btn" data-a="openPlayers">👥 Sửa người chơi</button>
    <button class="btn" data-a="openSheet" data-v="level">🌶️ Đổi mức độ</button>
    <button class="btn" data-a="toggleSound">${state.settings.sound ? '🔊 Âm thanh: bật' : '🔇 Âm thanh: tắt'}</button>
    <button class="btn bad" data-a="openSheet" data-v="confirmEnd">🏁 Kết thúc ván</button>
    <button class="btn ghost" data-a="closeSheet">Đóng</button>`,
  pause: () => `<div class="center"><div class="big-icon">⏸️</div><div class="big">Đang tạm dừng</div><button class="btn pri" data-a="closeSheet">▶️ Chơi tiếp</button></div>`,
  level: () => `<h2>Đổi mức độ</h2>
    ${[1, 2, 3].map(l => `<button class="btn ${state.turn.level === l ? 'pri' : ''}" data-a="setLevel" data-v="${l}" ${l > state.settings.maxLevel ? 'disabled' : ''}>${LEVELS[l].icon} ${LEVELS[l].name}</button>`).join('')}
    <button class="btn ghost" data-a="closeSheet">Đóng</button>`,
  confirmEnd: () => `<h2>Kết thúc ván này?</h2><button class="btn bad" data-a="endGame">🏁 Kết thúc, xem tổng kết</button><button class="btn ghost" data-a="closeSheet">Chơi tiếp</button>`,
  bag: () => {
    const p = P(ui.sheetData), line = (c, cls) => `<div class="cardline ${cls}"><span class="i">${CARDS[c].icon}</span><div><b>${CARDS[c].name}</b><br><span class="small muted">${CARDS[c].desc}</span></div></div>`;
    return `<h2 style="color:${p.color}">${p.emoji} ${esc(p.name)}</h2>
      <div class="small muted">🍺 ${p.stats.sips} ngụm${p.noAlcohol ? ' nước lọc' : ''}</div>
      <h3>🎁 Thẻ thưởng (${p.bonus.length}/${CONFIG.maxBonus})</h3>${p.bonus.map(c => line(c, 'bonus')).join('') || '<div class="muted">Trống</div>'}
      <h3>💀 Thẻ phạt (${p.penalty.length}/${CONFIG.deathAt})</h3>${p.penalty.map(c => line(c, 'penalty')).join('') || '<div class="muted">Trống</div>'}
      <button class="btn ghost" data-a="closeSheet">Đóng</button>`;
  },
  king: () => `<h2>👑 Vua 1 Phút</h2><div class="muted">Luật có hiệu lực đến lượt sau của bạn. Vi phạm = 1 ngụm.</div>
    <textarea id="kingText" rows="3" maxlength="90" placeholder="Ví dụ: cấm nói từ “uống”"></textarea>
    <button class="btn warn" data-a="kingConfirm">👑 Ban luật</button><button class="btn ghost" data-a="closeSheet">Thôi</button>`,
  violator: () => `<h2>Ai vi phạm luật?</h2>${pgrid(state.players.map(p => p.id), 'plusOne')}<button class="btn ghost" data-a="closeSheet">Đóng</button>`,
  players: () => `<h2>👥 Sửa người chơi</h2>${playerEditor(state.players)}<button class="btn pri" data-a="closePlayers">Xong</button>`,
};
function renderSheet() {
  const el = $('sheet');
  el.classList.toggle('open', !!ui.sheet);
  if (!ui.sheet) { el.innerHTML = ''; return; }
  const old = el.querySelector('.sheet'), top = old ? old.scrollTop : 0;
  el.innerHTML = `<div class="sheet">${SH[ui.sheet]()}</div>`;
  const now = el.querySelector('.sheet');
  now.scrollTop = top;
  if (old) now.style.animation = 'none';
}
function refreshEditor() { save(); if (S.view === 'game') renderSheet(); else render(); }
const plist = () => (S.view === 'game' ? state.players : S.draft.players);
const pOf = id => plist().find(p => p.id === id);

/* ===== Hành động ===== */
const A = {
  /* Setup */
  toSetup() { S.view = 'setup'; save(); render(); },
  toHome() { S.view = 'home'; save(); render(); },
  toRules() { S.view = 'rules'; save(); render(); },
  addPlayer() {
    const input = $('newName'), list = plist(), name = (input.value || '').trim();
    if (!name) { input.focus(); return toast('Nhập tên trước đã'); }
    if (list.length >= 12) return toast('Tối đa 12 người');
    const p = makePlayer(list); p.name = name; list.push(p);
    refreshEditor();
    const again = $('newName'); if (again && !again.disabled) again.focus();
  },
  delPlayer(d) {
    const list = plist();
    if (S.view !== 'game') { S.draft.players = list.filter(p => p.id !== d.id); return refreshEditor(); }
    if (list.length <= 2) return toast('Cần ít nhất 2 người');
    const wasCurrent = state.turn.currentPlayerId === d.id, after = wasCurrent ? nextPlayerId() : null;
    state.players = list.filter(p => p.id !== d.id);
    state.effects = state.effects.filter(e => !e.playerIds.includes(d.id));
    if (wasCurrent) beginTurn(after); // chỉ sửa được ở đầu lượt nên không kẹt luồng nào
    save(); renderChrome(); renderSheet();
  },
  toggleOpts(d) { ui.openId = ui.openId === d.id ? null : d.id; refreshEditor(); },
  togPlayer(d) { const p = pOf(d.id); p[d.v] = !p[d.v]; refreshEditor(); },
  togTag(d) {
    const p = pOf(d.id), i = p.bannedTags.indexOf(d.v);
    if (i >= 0) p.bannedTags.splice(i, 1); else p.bannedTags.push(d.v);
    refreshEditor();
  },
  setEmoji(d) { pOf(d.id).emoji = d.v; refreshEditor(); },
  setColor(d) { pOf(d.id).color = d.v; refreshEditor(); },
  setSetting(d) {
    const s = S.draft.settings;
    s[d.v] = d.v === 'order' ? d.id : Number(d.id);
    if (s.startLevel > s.maxLevel) s.startLevel = s.maxLevel;
    save(); render();
  },
  togSetting(d) { S.draft.settings[d.v] = !S.draft.settings[d.v]; save(); render(); },
  startGame() {
    S.game = state = newGame(S.draft);
    S.view = 'game';
    beginTurn(state.players[0].id);
  },
  resume() { ui.resumePrompt = false; S.view = 'game'; save(); render(); },
  discard() { ui.resumePrompt = false; S.game = state = null; S.view = 'home'; save(); render(); },

  /* Lượt chơi */
  choose(d) {
    const c = drawCard(d.v, cur());
    if (!c) {
      state.screen.noPool = [...(state.screen.noPool || []), d.v];
      toast('Hết thẻ phù hợp, chọn loại còn lại nhé');
      if (state.screen.noPool.length >= 2) return next();
      save(); return render();
    }
    state.turn.card = c; state.turn.targetB = c.bId;
    sfx('flip');
    go('card');
  },
  useSwap() {
    const p = cur(), old = state.turn.card;
    const c = drawCard(old.type, p, { level: old.level, exact: true, notId: old.id });
    if (!c) return toast('Không còn thẻ cùng mức để đổi');
    take(p, 'swap');
    state.turn.card = c; state.turn.targetB = c.bId;
    log(`${p.name} dùng Đổi Câu`);
    sfx('flip');
    go('card');
  },
  done() { go('approve'); },
  approve() {
    const p = cur(), isTruth = state.turn.card.type === 'truth';
    if (isTruth) p.stats.truths++; else p.stats.dares++;
    log(`${p.name} hoàn thành thẻ ${isTruth ? 'Thật' : 'Thách'}`);
    go('spin');
  },
  refuse() {
    const p = cur(), pen = makePenalty(p, REFUSE[state.turn.card.level]), got = randomPenalty();
    p.stats.refusals++;
    p.penalty.push(got);
    log(`${p.name} từ chối, nhận ${CARDS[got].name}`);
    go('penIntro', { pen, got });
  },
  next() { next(); },
  spin() {
    $('spinBtn').disabled = true;
    const segs = CONFIG.wheel, idx = weighted(segs, s => s.w);
    spinTo($('wheel'), segs, idx, CONFIG.spinMs, () => applySpin(segs[idx]));
  },
  toRescue() { flow({ name: 'rescue', pen: state.screen.pen }); },
  spinRescue() {
    const { pen } = state.screen, segs = rescueSegs();
    $('spinBtn').disabled = true;
    const win = Math.random() < CONFIG.rescueChance;
    spinTo($('wheel'), segs, win ? 0 : 1, CONFIG.rescueSpinMs, () => {
      $('rescueMsg').textContent = win ? '🍀 Trúng rồi!' : '🍺 Hụt rồi!';
      sfx(win ? 'reward' : 'buzz');
      if (win) confetti();
      ui.timers.push(setTimeout(() => {
        if (win) return go('pick', { mode: 'push', pen, title: 'Đẩy phạt sang ai?', candidates: others(pen.victim).map(o => o.id), random: true });
        LOGIC.useCards({ pen });
      }, CONFIG.rescueResultMs));
    });
  },
  useCard(d) {
    const { pen } = state.screen, p = P(pen.victim);
    if (d.v === 'shield') return blockWithShield(pen, p);
    take(p, d.v);
    const candidates = others(p.id).map(o => o.id);
    if (d.v === 'mirror') return go('pick', { mode: 'push', pen, title: '🪞 Đẩy phạt sang ai?', candidates, random: true });
    go('pick', { mode: 'ally', pen, title: '🤝 Kéo ai chia đôi?', candidates, random: true });
  },
  takeDrink() { LOGIC.drink({ pen: state.screen.pen }); },
  pickPlayer(d) { resolvePick(d.id); },
  pickRandom() {
    const btns = [...document.querySelectorAll('#pickArea .pgrid button')], final = pickOne(state.screen.candidates);
    document.querySelectorAll('#pickArea button').forEach(b => { b.disabled = true; });
    let n = reduced() ? 0 : 14 + Math.floor(Math.random() * 6);
    const iv = setInterval(() => {
      btns.forEach(b => b.classList.remove('hl'));
      if (n-- <= 0) {
        clearInterval(iv);
        btns.find(x => x.dataset.id === final).classList.add('hl');
        ui.timers.push(setTimeout(() => resolvePick(final), 500));
        return;
      }
      pickOne(btns).classList.add('hl'); sfx('tick');
    }, 90);
    ui.timers.push(iv);
  },
  reactShield() { const { pen } = state.screen; blockWithShield(pen, P(pen.victim)); },
  reactMirror() {
    const { pen } = state.screen, X = P(pen.victim);
    take(X, 'mirror'); X.stats.pushes++;
    log(`${X.name} bật ngược bằng Gương`);
    LOGIC.react({ pen: { ...pen, victim: pen.from, from: X.id, chain: [...pen.chain, X.id], bounces: pen.bounces + 1 } });
  },
  reactDrink() { LOGIC.drink({ pen: state.screen.pen }); },
  bagDrop(d) {
    const s = state.screen, p = P(s.pid), icon = CARDS[s.card].icon;
    p.bonus[Number(d.v)] = s.card;
    next();
    flyTo(icon, p.id);
  },
  deathDraw() {
    const s = state.screen, p = P(s.pid), L = state.settings.maxLevel, notId = s.dare ? s.dare.id : undefined;
    const c = drawCard('dare', p, { level: L, exact: true, notId }) || drawCard('dare', p, { level: L, notId });
    if (!c) return toast('Không rút được thẻ phù hợp, cả bàn tự ra đề nhé');
    s.dare = c; save(); render();
  },
  deathDone(d) {
    const p = P(state.screen.pid);
    addSips(p, CONFIG.bottomsUpSips + (d.v === 'refuse' ? REFUSE[state.settings.maxLevel] : 0));
    p.stats.deathSentences++;
    p.penalty = [];
    log(`${p.name} đã thi hành Án Tử`);
    next();
  },

  /* Sự kiện */
  eventGo() { runEvent(state.screen.ev); },
  neverTick(d) {
    const s = state.screen, i = s.ticks.indexOf(d.id);
    if (i >= 0) s.ticks.splice(i, 1); else s.ticks.push(d.id);
    save(); render();
  },
  neverDone() {
    const s = state.screen;
    s.ticks.forEach(id => addSips(P(id), s.ev.sips));
    next();
  },

  /* Thanh trên, menu */
  openBag(d) { ui.sheetData = d.id; ui.sheet = 'bag'; renderSheet(); },
  openMenu() { ui.sheet = 'menu'; renderSheet(); },
  openSheet(d) { ui.sheet = d.v; renderSheet(); },
  closeSheet() { ui.sheet = null; renderSheet(); },
  openPlayers() {
    if (state.screen.name !== 'turn') return toast('Đợi tới đầu lượt sau rồi sửa nhé');
    ui.openId = null; ui.sheet = 'players'; renderSheet();
  },
  closePlayers() {
    state.players.forEach((p, i) => { p.name = p.name.trim() || `Người ${i + 1}`; });
    ui.sheet = null; renderSheet(); save(); render();
  },
  toggleSound() { state.settings.sound = !state.settings.sound; save(); renderSheet(); },
  setLevel(d) {
    state.turn.level = Number(d.v); state.turn.turnsAtLevel = 0;
    ui.sheet = null; renderSheet(); save(); renderChrome();
    toast(`${LEVELS[state.turn.level].icon} Mức ${LEVELS[state.turn.level].name}`);
  },
  openKing() { ui.sheet = 'king'; renderSheet(); },
  kingConfirm() {
    const text = $('kingText').value.trim(), p = cur();
    if (!text) return toast('Nhập luật trước đã');
    take(p, 'king');
    state.effects.push({ type: 'king', playerIds: [p.id], text, turnsLeft: null });
    log(`${p.name} ra luật: ${text}`);
    ui.sheet = null; renderSheet(); sfx('reward'); save(); render();
  },
  openViolator() { ui.sheet = 'violator'; renderSheet(); },
  plusOne(d) {
    const p = P(d.id); addSips(p, 1);
    log(`${p.name} bị bắt lỗi: +1 ngụm`);
    if (ui.sheet) { ui.sheet = null; renderSheet(); }
    toast(`${p.name} uống ${sipWord(p, 1)} 🍺`);
    sfx('buzz'); save(); renderChrome();
  },
  endGame() {
    ui.sheet = null; renderSheet();
    state.ended = true; S.view = 'end'; save(); render();
    sfx('reward'); confetti();
  },
  againKeep() {
    S.draft = { players: state.players, settings: state.settings };
    S.game = state = newGame(S.draft);
    S.view = 'game';
    beginTurn(state.players[0].id);
  },
  toHomeClear() {
    S.draft = { players: state.players, settings: state.settings };
    S.game = state = null; S.view = 'home'; save(); render();
  },
};
function resolvePick(id) {
  const s = state.screen;
  if (s.mode === 'push') {
    const actor = P(s.pen.victim);
    actor.stats.pushes++;
    log(`${actor.name} đẩy phạt sang ${P(id).name}`);
    return LOGIC.react({ pen: { ...s.pen, victim: id, from: actor.id, chain: [...s.pen.chain, actor.id] } });
  }
  if (s.mode === 'ally') {
    const actor = s.pen.victim, half = Math.ceil(s.pen.sips / 2);
    log(`${P(actor).name} kéo ${P(id).name} chia đôi`);
    state.queue.unshift({ name: 'drink', pen: { victim: actor, sips: half, chain: [] } });
    return LOGIC.react({ pen: { victim: id, sips: half, from: actor, chain: [], bounces: 0, shieldOnly: true } });
  }
  if (s.mode === 'jackpot') {
    return LOGIC.react({ pen: { victim: id, sips: CONFIG.bottomsUpSips, bottoms: true, from: state.turn.currentPlayerId, chain: [], bounces: 0 } });
  }
  if (s.mode === 'loser') {
    return go('penIntro', { pen: makePenalty(P(id), s.ev.sips), got: null });
  }
}

/* ===== Sự kiện DOM ===== */
document.addEventListener('click', e => {
  if (e.target === $('sheet') && ui.sheet && ui.sheet !== 'pause') { A.closeSheet(); return; }
  const el = e.target.closest('[data-a]');
  if (!el || el.disabled) return;
  if (!['spin', 'spinRescue'].includes(el.dataset.a)) sfx('click');
  A[el.dataset.a](el.dataset, el);
});
document.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset.in === 'name') { pOf(el.dataset.id).name = el.value; save(); if (S.view === 'game') renderChrome(); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.id === 'newName') { e.preventDefault(); A.addPlayer(); }
});

/* ===== Khởi động ===== */
load();
if (state && !state.ended) { S.view = 'home'; ui.resumePrompt = true; }
else if (state && state.ended) { S.view = 'end'; }
else if (S.view === 'game' || S.view === 'end') { S.view = 'home'; }
render();
</script>
</body>
</html>
